name: "on-push"
on:
  - push
jobs:
  build:
    name: Build (${{ matrix.runner }}, Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            xcode: "16.4"
          - runner: macos-14
            xcode: "15.4"
          - runner: macos-15
            xcode: "16.0"
          - runner: macos-15
            xcode: "26.0.1"
          - runner: macos-26
            xcode: "26.3"
    steps:
      - uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies -project "Host Cassettes.xcodeproj" -scheme "Host Cassettes"

      - name: Build arm64 app
        run: ./build.sh

  test:
    name: Test (${{ matrix.runner }}, Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            xcode: "16.4"
          - runner: macos-15-intel
            xcode: "16.4"
          - runner: macos-14
            xcode: "15.4"
          - runner: macos-15
            xcode: "16.0"
          - runner: macos-15
            xcode: "26.0.1"
          - runner: macos-26
            xcode: "26.3"
            experimental: true
    steps:
      - uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies -project "Host Cassettes.xcodeproj" -scheme "Host Cassettes"

      - name: Test
        run: xcodebuild test -project "Host Cassettes.xcodeproj" -scheme "Host Cassettes" -destination "platform=macOS" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
